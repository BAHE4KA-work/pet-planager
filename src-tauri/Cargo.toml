[package]
name = "planager"
version = "0.1.0"
description = "Planager desktop planning workspace"
authors = ["Planager"]
edition = "2021"

[lib]
name = "planager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
tauri = { version = "2", features = [] }
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
